org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=false
# This box also serves the library. A default-priority build has starved the
# container and the gateway badly enough that both stopped answering, so Gradle
# runs at low scheduling priority with a single worker; scripts/android.sh adds
# an idle I/O class and a CPU quota on top.
org.gradle.priority=low
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
kotlin.code.style=official
