name: CI

on:
  # Pull requests only. A push to main is gated by the edge workflow, which *calls* this one; running it
  # again on push meant every commit started two identical runs, and a reusable workflow inherits its
  # caller's concurrency group, so the pair cancelled each other and the push showed a red X in
  # seconds. One run per commit, and the check that gates main is the one that actually finished.
  pull_request:
  # So the edge image can depend on the same checks instead of duplicating them: a red commit must
  # never publish an installable tag.
  workflow_call:

# A superseded commit's checks are worthless once a newer one exists, so cancel instead of paying
# for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      # Formatting is a gate, not a preference: an unformatted file went out in a release because the
      # only thing that looked at gofmt printed its output and carried on.
      # A block scalar, not a one-liner: an unquoted scalar containing ": " is parsed as a nested
      # mapping, so this line made the whole workflow invalid and every run on main failed in zero
      # seconds with no jobs -- the gate it carries never ran at all.
      - run: |
          test -z "$(gofmt -l internal cmd)" || { gofmt -l internal cmd; echo "run: gofmt -w internal cmd"; exit 1; }
      - run: ./scripts/check-store-readiness.sh
      - run: ./scripts/check-module-sizes.sh
      - run: CGO_ENABLED=0 go build -trimpath ./...

  install:
    # The install contract: the image builds, boots with empty volumes and no configuration,
    # and serves a usable app that survives a restart. Everything else in "easy to install"
    # can be measured against this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/install-smoke.sh
      - name: Show container logs on failure
        if: failure()
        run: docker ps -a && docker volume ls

  layout-gate:
    # The cross-engine layout gate (docs/rewrite-plan.md §9, law L8): a Firefox-only dock bug shipped at 0.1.86
    # because nothing checked the shell in anything but Chromium. Boots a throwaway, library-less install (same
    # shape as the `install` job) and runs scripts/layout-gate.mjs against it in Chromium, Firefox and WebKit.
    # Header-height/first-cover checks need a real library and are skipped on this fixture-free box; they run
    # against a seeded install once Phase 0.3's contract fixtures exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Build the image
        run: docker build -q -f Containerfile -t mochil:layout-gate .
      - name: Boot a fresh install and create the first account
        run: |
          set -eu
          docker volume create layout-gate-config >/dev/null
          docker volume create layout-gate-data >/dev/null
          docker volume create layout-gate-books >/dev/null
          docker run -d --name layout-gate -p 127.0.0.1:18199:8080 \
            -v layout-gate-config:/config -v layout-gate-data:/data -v layout-gate-books:/books \
            mochil:layout-gate >/dev/null
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -m 2 -w '%{http_code}' http://127.0.0.1:18199/healthz || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          [ "$code" = 200 ] || { echo "server never became healthy"; docker logs layout-gate; exit 1; }
          token=$(curl -s http://127.0.0.1:18199/setup | sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' | head -1)
          [ -n "$token" ] || { echo "setup page had no csrf token"; exit 1; }
          curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18199/setup \
            --data-urlencode "csrf=$token" --data-urlencode "username=layout-gate" \
            --data-urlencode "password=a long enough password" --data-urlencode "confirm=a long enough password"
      - name: Run the layout gate in Chromium, Firefox and WebKit
        env:
          MOCHIL_BASE_URL: http://127.0.0.1:18199
          OPDSHELF_USERNAME: layout-gate
          OPDSHELF_PASSWORD: a long enough password
        run: node scripts/layout-gate.mjs
      - name: Show container logs on failure
        if: failure()
        run: docker logs layout-gate

  web:
    # Phase 1 (docs/rewrite-plan.md §8): the new React/TypeScript app, served at /next/ until cutover (§11).
    # Lint laws L1/L2/L3/L5/L7 are enforced (eslint.config.js + .stylelintrc.json) with lint:fixtures proving
    # each rule actually fires on a deliberate violation, not just existing on paper. L6 is covered by
    # scripts/contrast-check.mjs already. L8 is now this app's own job (22 Nov 2026): the Library screen is real,
    # so web/e2e/shell.spec.ts runs the cross-engine layout gate here directly — hermetic on contracts/api
    # fixtures, no server, no credentials — rather than waiting on the Containerfile-based layout-gate job above,
    # which still covers the *legacy* shell at `/`.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:fixtures
      - run: npm test
      - run: npm run build
      # The bundle budget from docs/rewrite-plan.md §9 — now a real gate instead of a number re-measured by hand
      # after each deploy, which is how three slices in a row landed within 1 kB of the limit unnoticed.
      - run: npm run size
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generated design tokens must match design/tokens.json
        run: npm run tokens:check
      - name: Every theme must clear WCAG 2.1 AA contrast
        run: npm run tokens:contrast
      - run: npm run test:frontend
      - name: Install browser for isolated interaction checks
        run: npx playwright install --with-deps chromium
      - name: Verify playlist form recovery without a live server
        run: npm run test:browser:playlists
      - name: Verify audio chapter keyboard navigation
        run: npm run test:browser:audio-chapters

  android:
    runs-on: ubuntu-latest
    # A hung lint or daemon used to sit here for hours: this job is verification only, so fail it
    # quickly and let the release jobs carry on rather than burning a runner slot.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # The runner image already ships an Android SDK; the setup action tried to install the
      # `tools` package, which no longer exists in the SDK repository, and failed the job. Install
      # exactly what the build needs instead.
      - name: Android SDK packages
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(ls -d "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -x "$sdkmanager" || { echo "no sdkmanager under $sdk_root" >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      # Verification only: never import the private installation/update key.
      # These ephemeral-key APKs are not uploaded or published by this job.
      - name: Create temporary CI-only signing identity
        env:
          CI_SIGNING_KEY: ${{ runner.temp }}/mochil-ci.keystore
        run: |
          test ! -e "$CI_SIGNING_KEY"
          umask 077
          keytool -genkeypair -noprompt -keystore "$CI_SIGNING_KEY" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Mochil CI verification only"
      - name: Verify mobile, TV, direct, and store variants
        working-directory: android
        env:
          MOCHIL_OPTIMIZED_KEYSTORE_PATH: ${{ runner.temp }}/mochil-ci.keystore
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx1g"
        run: ./gradlew --no-daemon testDirectDebugUnitTest testStoreDebugUnitTest assembleDirectOptimized assembleStoreOptimized
      - name: Verify packaged store-readiness boundary
        run: ./scripts/check-store-readiness.sh android/app/build/outputs/apk/direct/optimized/app-direct-optimized.apk android/app/build/outputs/apk/store/optimized/app-store-optimized.apk

  android-lint:
    # Lint holds the whole module graph and is the slowest thing here. Kept out of the job above so a
    # stalled lint can never mask a test result, and bounded so it cannot sit on a runner for hours.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK packages
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(ls -d "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -x "$sdkmanager" || { echo "no sdkmanager under $sdk_root" >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      # The optimized variants assert on a signing key at configuration time, so lint needs the same
      # ephemeral CI identity as the build job -- without it Gradle fails before linting anything.
      - name: Create temporary CI-only signing identity
        env:
          CI_SIGNING_KEY: ${{ runner.temp }}/mochil-ci.keystore
        run: |
          test ! -e "$CI_SIGNING_KEY"
          umask 077
          keytool -genkeypair -noprompt -keystore "$CI_SIGNING_KEY" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Mochil CI verification only"
      - name: Lint both flavours
        working-directory: android
        env:
          MOCHIL_OPTIMIZED_KEYSTORE_PATH: ${{ runner.temp }}/mochil-ci.keystore
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx1g"
        run: ./gradlew --no-daemon lintDirectOptimized lintStoreOptimized
